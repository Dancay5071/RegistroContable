<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fondo Verde Bosque FinTech -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246845" />
      <stop offset="100%" stop-color="#16432b" />
    </linearGradient>

    <!-- Gradiente Ámbar para Ahorro y Acento -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Gradiente Esmeralda de Crecimiento / Tracking -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Sombra suave para dar profundidad -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Contenedor Squircle Moderno -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" />

  <!-- Monograma Isotipo FinTrack (F + Trazo de Crecimiento / Balanza) -->
  <g filter="url(#softGlow)">
    <!-- Barra vertical principal "F" -->
    <rect x="24" y="24" width="10" height="52" rx="5" fill="#ffffff" />

    <!-- Barra superior horizontal "F" -->
    <rect x="24" y="24" width="46" height="10" rx="5" fill="#ffffff" />

    <!-- Barra media dorada (Ahorro / Estabilidad) -->
    <rect x="24" y="43" width="28" height="9" rx="4.5" fill="url(#amberGrad)" />

    <!-- Línea de tendencia ascendente (Track & Crecimiento) -->
    <path 
      d="M 44 74 L 60 56 L 76 56" 
      fill="none" 
      stroke="url(#trendGrad)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Nodo de destino / Indicador de objetivo financiero -->
    <circle cx="76" cy="56" r="6" fill="#6ee7b7" />
    <circle cx="76" cy="56" r="2.5" fill="#16432b" />
  </g>
</svg>

